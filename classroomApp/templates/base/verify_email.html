{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Verification</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles/dark_mode.css">
    <link rel="stylesheet" href="{% static 'styles/verify_email.css' %}">
</head>
<body>
    <div class="login-container">
        <div class="form-wrapper">
            <h2 class="form-title">Email Verification</h2>
            <form method="POST" action="">
                {% csrf_token %}
                <div class="form-group">
                    <label for="email_verification_code">Verification Code</label>
                    <input 
                        type="text" 
                        id="verification-code"
                        name="email_verification_code" 
                        class="form-input"
                        placeholder="Enter code"
                        maxlength="6"
                        autocomplete="off"
                    >
                    <span class="verification-hint">Please enter the 6-digit code sent to your email</span>
                </div>
                <button type="submit" class="form-submit">Verify Email</button>
            </form>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
